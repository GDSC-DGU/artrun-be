spring:
  application:
    name: artrun-be

  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:artrun}
    username: ${DB_USERNAME:artrun}
    password: ${DB_PASSWORD:artrun}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}

mapbox:
  api-key: ${MAPBOX_API_KEY:}

jwt:
  secret: ${JWT_SECRET:artrun-super-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}
  access-token-expiration: 3600000      # 1시간
  refresh-token-expiration: 1209600000  # 14일

oauth:
  kakao:
    user-info-url: https://kapi.kakao.com/v2/user/me
  google:
    user-info-url: https://www.googleapis.com/oauth2/v3/userinfo

aws:
  s3:
    bucket: ${S3_BUCKET:artrun-bucket}
    region: ${AWS_REGION:ap-northeast-2}
    base-url: ${S3_BASE_URL:https://artrun-bucket.s3.ap-northeast-2.amazonaws.com}
  credentials:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ArtRun Backend
    version: 0.0.1

logging:
  level:
    com.artrun.server: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.artrun.server: INFO
    org.hibernate.SQL: WARN
