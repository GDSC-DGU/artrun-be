[project]
name = "mobile-running-music-backend-starter"
version = "0.1.0"
description = "Mobile running music segment recommendation backend starter"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0",
  "numpy>=1.24",
  "pytest>=8.0",
  "librosa>=0.10",
  "soundfile>=0.12"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
